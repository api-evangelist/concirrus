name: Concirrus
kind: company
description: >-
  Concirrus Ltd is a London-headquartered insurtech founded in 2012 that builds
  AI-driven underwriting software for the specialty and commercial insurance
  market — marine (hull, cargo, P&I), aviation, construction, property, and
  political violence and terrorism. Its platform (Quest, Marine One, the
  Underwriting Workbench, Exposure Management, Loss Run Intelligence, and an
  "Enterprise Model" universal submission-ingestion layer) ingests broker
  submissions, structures the risk data, scores behavioural risk, and returns
  rating and exposure decisions to carriers, MGAs and brokers — much of it aimed
  at the Lloyd's and London subscription market. Concirrus is a vendor to
  insurers rather than an insurer itself, so it touches quote and rating rather
  than bind, issue or FNOL. Its API posture is partner-gated: marketing
  describes "a modular, API first platform" and "seamless integration with
  London Market platforms", but as of 2026-07-25 there is no public developer
  portal, no published API reference, no downloadable OpenAPI/Swagger, no
  Postman collection, and no public GraphQL or webhook catalog. Every developer
  and docs hostname probed (developer./developers./docs./api. on both
  concirrus.com and concirrus.ai) does not resolve, and every on-site developer
  path returns 404. Integration is obtained through a commercial engagement or
  the partner ecosystem programme, not self-serve signup. No ACORD, AL3, NGDS or
  ACORD XML reference appears anywhere on the public site. Concirrus does publish
  a real compliance posture: in August 2025 it announced ISO/IEC 42001 (AI
  management), ISO/IEC 27001 (information security) and SOC 2 certification,
  claiming to be the first insurtech to hold all three — though no trust center
  or downloadable report accompanies the announcement.

actions:
  openapiHarvested: false
  specsCount: 0
  apisListed: 0
  reason: |
    apis[] is intentionally empty. Concirrus publishes no self-serve developer
    portal and no machine-readable API definition, so there is nothing real to
    list. Recording the absence accurately — partner-gated, commercially
    negotiated integration with no ACORD posture — is the correct outcome for
    this provider and for the UK specialty-insurance segment generally.

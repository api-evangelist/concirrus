  transports:
  - protocol: REST
    documented: false
    note: An HTTP API almost certainly exists behind the customer platform ("API
      first platform" in partner marketing), but no base URL, endpoint, or reference
      is published.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    documented: false
  - protocol: ACORD/EDI
    documented: false
    note: No ACORD AL3, ACORD XML, NGDS or IVANS reference anywhere on the public site.
  marketContext: |
    United Kingdom. The FCA and PRA impose no open-insurance obligation, and the
    FCA's Open Finance work remains consultation rather than rule. The only
    market-wide data and API infrastructure effort is the London Market
    modernization programme (Blueprint Two, PPL, Whitespace, Ki), which is aimed
    at brokers and syndicates rather than developers. Concirrus sits squarely in
    that seam: it markets London Market connectivity while publishing nothing a
    developer can read, which is exactly the invisibility this data set is
    measuring.

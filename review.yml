aid: concirrus
name: Concirrus
review:
  question: Does Concirrus expose a public, self-serve developer portal or downloadable
    API definitions for its specialty insurance underwriting platform?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  gated: true
findings:
  summary: |
    Concirrus Ltd (London, founded 2012) is a specialty-insurance software
    vendor, not a carrier. It sells AI underwriting and exposure-management
    software (Quest, Marine One, Underwriting Workbench, Exposure Management,
    Loss Run Intelligence, and the "Enterprise Model" submission-ingestion
    layer) to insurers, MGAs and brokers across marine, aviation, construction,
    property, and political violence and terrorism.

    Its public web presence is a WordPress marketing site. The apex
    concirrus.com fails TLS negotiation; www.concirrus.com returns 200 and
    redirects to https://concirrus.ai/, which is now the live property. There
    is NO public developer portal, NO API reference, NO downloadable
    OpenAPI/Swagger, NO Postman collection, NO GraphQL endpoint, NO published
    .proto, and NO event/webhook or AsyncAPI catalog.

    The only public API language is marketing copy on the partner page:
    "Concirrus provides a modular, API first platform, joint go to market
    alignment, and partner enablement." The marine product page adds
    "Seamlessly integrate with London Market platforms to streamline data flow
    and ensure compliance across all risk classes" without naming PPL,
    Whitespace, Lloyd's, Blueprint Two, or any protocol. Integration is
    obtained through a commercial engagement (book-a-demo) or the partner
    ecosystem programme. This is a classic UK specialty/London-market posture:
    real machine-to-machine integration exists inside carrier and broker
    deployments but is entirely invisible from the outside.

  subdomainEnumeration:
    source: crt.sh certificate transparency
    concirrus.com: cpanel, dehli1, eramba, ind1ff0001, ind1ff0001-ext, info, keycloaktest,
      london1, london1-int, mail, simsafe, snipeit, support, ukl1ff0002, vpninternal,
      vpntest, webdisk, webmail, whistle, www
    concirrus.ai: learn, www
    note: Every non-www host is internal corporate infrastructure (Keycloak test,
      VPN, eramba GRC, Snipe-IT asset management, cPanel/webmail). No developer,
      docs, api, or portal host exists on either domain.
  acordPosture: no ACORD reference found — site search for ACORD, AL3, NGDS and
    ACORD XML returns zero results across concirrus.ai, and no ACORD solution-provider
    listing was found
  insuranceVerbs:
    quote: partner-gated — rating/quote decisioning exists inside the Underwriting
      Workbench and the "Enterprise Model" submission-ingestion layer, but is not
      publicly documented as an API
    bind: not exposed — Concirrus is a software vendor, not a carrier or MGA of record
    issue: not exposed
    fnol: not exposed — claims/loss data is consumed via Loss Run Intelligence, not
      published as an FNOL API
    audience: partner-only (carriers, MGAs, brokers under commercial contract); no
      consumer-facing or agent-facing self-serve surface
  authModel: not publicly documented. No OIDC or OAuth authorization-server metadata
    is served at the well-known paths. A keycloaktest.concirrus.com host in
    certificate transparency suggests Keycloak-based identity for internal or
    customer-tenant SSO, but nothing about the scheme is documented publicly and
    no assumption is recorded here.
  specsHarvested: 0
